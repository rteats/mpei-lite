name: Prune merged branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-merged-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only safely merged, unprotected, unused branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse --verify refs/remotes/origin/main >/dev/null
          # Names are always supplied by GitHub and may contain slashes.
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[] | select(.protected == false) | .name' > /tmp/prunable-branches
          gh pr list --state open --limit 500 --json headRefName \
            --jq '.[].headRefName' > /tmp/active-pr-heads
          count=0
          while IFS= read -r branch; do
            case "$branch" in
              ""|main|master|dev|develop|stable|release/*) continue ;;
            esac
            if grep -Fqx -- "$branch" /tmp/active-pr-heads; then
              echo "Keep open PR: $branch"
              continue
            fi
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              continue
            fi
            # Git ancestry protects work not merged into main (including PRs
            # with unmerged commits), even if the branch is very old.
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/main"; then
              echo "Keep unmerged: $branch"
              continue
            fi
            echo "Prune merged: $branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            count=$((count + 1))
          done < /tmp/prunable-branches
          echo "Deleted $count safely merged branches"
