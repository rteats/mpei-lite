name: Mail IMAP connectivity diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail-imap-probe.yml'
      - 'scripts/probe_mpei_imap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Unauthenticated IMAPS connectivity probe
        run: python3 scripts/probe_mpei_imap.py
