name: Refresh campus geometry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_campus_geometry.py'
      - '.github/workflows/campus-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Download and simplify OpenStreetMap geometry
        run: python3 scripts/build_campus_geometry.py
      - name: Publish geometry for review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/assets/campus_osm.json")
          contents = path.read_text().strip()
          for i in range(0, len(contents), 12000):
              print(f"MAPDATA|{i // 12000}|{contents[i:i+12000]}", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: campus-osm-geometry
          path: app/src/main/assets/campus_osm.json
          retention-days: 30
