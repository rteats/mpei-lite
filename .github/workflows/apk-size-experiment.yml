name: APK size experiment

on:
  pull_request:
    paths:
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - ".github/workflows/apk-size-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare regular and opt-in shrink builds
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Materialize disposable development signing key
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"

      - name: Build baseline APK
        run: |
          gradle --no-daemon assembleDevRelease -PVERSION_CODE=1 -PVERSION_NAME=0.4.0-size-baseline
          cp app/build/outputs/apk/dev/release/app-dev-release.apk "$RUNNER_TEMP/baseline.apk"

      - name: Build minified APK in isolation
        run: |
          gradle --no-daemon clean assembleDevRelease -POPTIMIZE_RELEASE=true \
            -PVERSION_CODE=1 -PVERSION_NAME=0.4.0-size-experiment
          cp app/build/outputs/apk/dev/release/app-dev-release.apk "$RUNNER_TEMP/optimized.apk"

      - name: Write size comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          baseline = Path(os.environ["RUNNER_TEMP"]) / "baseline.apk"
          optimized = Path(os.environ["RUNNER_TEMP"]) / "optimized.apk"
          old, new = baseline.stat().st_size, optimized.stat().st_size
          saving = old - new
          percent = 100 * saving / old
          report = (f"### APK size comparison\n\n"
                    f"| Variant | Bytes | MiB |\n|---|---:|---:|\n"
                    f"| Baseline | {old:,} | {old/1048576:.2f} |\n"
                    f"| R8 + resource shrinking | {new:,} | {new/1048576:.2f} |\n\n"
                    f"**Difference:** {saving:+,} bytes ({percent:+.2f}% smaller).\n\n"
                    "Experimental APK is NOT promoted to the Dev channel. "
                    "Device smoke tests remain required before enabling shrinking.\n")
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(report)
          PY

      - name: Upload shrink experiment for isolated device testing
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-experiment
          path: ${{ runner.temp }}/optimized.apk
          if-no-files-found: error
          retention-days: 7
