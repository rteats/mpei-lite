name: Dev APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dev-apk
  cancel-in-progress: true

env:
  DEV_BASE_VERSION: "0.5.0"

jobs:
  build-dev:
    name: Build rolling dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prune obsolete Actions caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_actions_cache.py --apply

      - name: Verify architecture ownership boundaries
        run: python3 scripts/check_architecture.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: false
          cache-cleanup: on-success
          gradle-home-cache-excludes: |
            caches/build-cache-1
            caches/keyrings

      - name: Materialize public dev keystore
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build signed dev APK
        run: |
          # R8 trial on rolling Dev only. Stable release is unaffected.
          gradle --no-daemon testDevDebugUnitTest assembleDevRelease \
            -POPTIMIZE_RELEASE=true \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=${DEV_BASE_VERSION}-dev.${{ github.run_number }}
          cp app/build/outputs/apk/dev/release/app-dev-release.apk MPEI-Neo-Dev.apk

      - name: Prepare API-free Dev update manifest
        run: |
          SHA256=$(sha256sum MPEI-Neo-Dev.apk | cut -d ' ' -f1)
          cat > update.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "${DEV_BASE_VERSION}-dev.${{ github.run_number }}",
            "sha256": "${SHA256}"
          }
          EOF

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-dev-apk
          path: MPEI-Neo-Dev.apk
          if-no-files-found: error
          retention-days: 14

      - name: Move rolling dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      # GitHub's rolling Release retains assets not mentioned in the new build.
      # Remove APKs from the discontinued MapKit multi-ABI packaging so nobody
      # accidentally installs a stale, much larger version.
      - name: Remove obsolete MapKit APK variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            gh release delete-asset dev "MPEI-Neo-Dev-${abi}.apk" --yes || true
          done

      - name: Publish rolling dev prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: MPEI Lite Dev ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automated development build from `main`.

            R8 code minification and Android resource shrinking are ENABLED for this Dev testing build.
            Stable releases are unchanged.

            versionCode: ${{ github.run_number }}
            versionName: ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
            commit: ${{ github.sha }}

            This package is `com.rteats.mpeineo.dev` and uses the public disposable development signing key.
          files: |
            MPEI-Neo-Dev.apk
            update.json
