name: Dev APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-apk
  cancel-in-progress: true

env:
  DEV_BASE_VERSION: "0.4.0"

jobs:
  build-dev:
    name: Build rolling dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Materialize public dev keystore
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build signed dev APK
        env:
          YANDEX_MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: |
          gradle --no-daemon testDevDebugUnitTest assembleDevRelease             -PVERSION_CODE=${{ github.run_number }}             -PVERSION_NAME=${DEV_BASE_VERSION}-dev.${{ github.run_number }}
          python3 - <<'PY'
          import json, shutil, zipfile
          from pathlib import Path
          directory = Path("app/build/outputs/apk/dev/release")
          manifest = json.loads((directory / "output-metadata.json").read_text())
          expected = {"arm64-v8a", "armeabi-v7a", "x86_64", "x86"}
          copied = set()
          for element in manifest["elements"]:
              abi = next((f["value"] for f in element.get("filters", [])
                          if f.get("filterType") == "ABI"), None)
              if abi is not None and abi not in expected:
                  continue
              filename = f"MPEI-Neo-Dev-{abi}.apk" if abi else "MPEI-Neo-Dev.apk"
              source = directory / element["outputFile"]
              shutil.copy2(source, filename)
              copied.add(abi or "universal")
              with zipfile.ZipFile(filename) as apk:
                  libs = sorted({p.split("/")[1] for p in apk.namelist()
                                 if p.startswith("lib/")})
              print(f"APK {filename}: {Path(filename).stat().st_size / 1e6:.1f} MB, ABIs={libs}")
          assert copied == expected | {"universal"}, (
              f"Missing APK variants: {expected | {'universal'} - copied}; metadata={manifest}")
          PY

      - name: Prepare API-free Dev update manifest
        run: |
          python3 - <<'PY'
          import json, hashlib, os
          from pathlib import Path
          def digest(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          variants = {
              abi: digest(f"MPEI-Neo-Dev-{abi}.apk")
              for abi in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86")
          }
          manifest = {
              "versionCode": int(os.environ["GITHUB_RUN_NUMBER"]),
              "versionName": f'{os.environ["DEV_BASE_VERSION"]}-dev.{os.environ["GITHUB_RUN_NUMBER"]}',
              "sha256": digest("MPEI-Neo-Dev.apk"),
              "apkVariants": variants,
          }
          Path("update.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-dev-apk
          path: MPEI-Neo-Dev*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Move rolling dev tag
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev --force

      - name: Publish rolling dev prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: MPEI Neo Dev ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automated development build from `main`.

            versionCode: ${{ github.run_number }}
            versionName: ${{ env.DEV_BASE_VERSION }}-dev.${{ github.run_number }}
            commit: ${{ github.sha }}

            This package is `com.rteats.mpeineo.dev` and uses the public disposable development signing key.
          files: |
            MPEI-Neo-Dev.apk
            MPEI-Neo-Dev-arm64-v8a.apk
            MPEI-Neo-Dev-armeabi-v7a.apk
            MPEI-Neo-Dev-x86_64.apk
            MPEI-Neo-Dev-x86.apk
            update.json
