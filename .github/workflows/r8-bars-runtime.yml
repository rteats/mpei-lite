name: R8 BARS runtime regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/src/main/java/com/rteats/mpeineo/ui/BarsViewModel.kt"
      - "app/src/main/java/com/rteats/mpeineo/ui/BarsAuthenticatedRoutes.kt"
      - "app/src/androidTest/java/com/rteats/mpeineo/BarsR8JsonRuntimeTest.kt"
      - "app/proguard-rules.pro"
      - "app/build.gradle.kts"
      - ".github/workflows/r8-bars-runtime.yml"

permissions:
  contents: read

concurrency:
  group: r8-bars-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  minified-runtime:
    name: Test BARS parsers inside an R8 release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Sign with disposable development key
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exercise minified reflection on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon connectedDevR8TestAndroidTest \
              -PPR_NUMBER=${{ github.event.pull_request.number }} \
              -POPTIMIZE_RELEASE=true \
              -PR8_RUNTIME_TEST=true \
              -Pandroid.testInstrumentationRunnerArguments.class=com.rteats.mpeineo.BarsR8JsonRuntimeTest

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r8-bars-runtime-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
