name: Actions maintenance

on:
  schedule:
    - cron: "20 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: actions-maintenance
  cancel-in-progress: false

jobs:
  prune:
    name: Prune expired CI caches and runs
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test maintenance policy
        run: python3 -m unittest discover -s scripts -p "test_*.py" -q

      - name: Prune obsolete caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintain_actions.py --apply

      - name: Prune retired runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintain_actions.py --runs-only --apply
