name: Main APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-apk
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish dated APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-cleanup: on-success
          gradle-home-cache-excludes: |
            caches/keyrings
      - name: Set Moscow build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main APK jobs run in series. Use the last published release as
          # the daily counter so failed attempts do not consume build numbers.
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest"             --jq '.name' 2>/dev/null || true)"
          VERSION_NAME="$(python3 scripts/moscow_version.py "$PREVIOUS")"
          CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Build version: $VERSION_NAME (Europe/Moscow); Android code: $CODE"
      - name: Prepare existing signing key
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: |
          gradle --no-daemon assembleRollingRelease \
            -POPTIMIZE_RELEASE=true \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/rolling/release/app-rolling-release.apk MPEI-Lite.apk
      - name: Write checked update manifest
        run: |
          SHA256="$(sha256sum MPEI-Lite.apk | cut -d ' ' -f1)"
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$SHA256" > update.json
      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: mpei-lite-apk
          path: |
            MPEI-Lite.apk
            update.json
          retention-days: 14
          if-no-files-found: error
      - name: Point latest tag at built commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish one rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: MPEI Lite ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            Single rolling MPEI Lite build from main.
            versionCode: ${{ env.VERSION_CODE }}
            versionName: ${{ env.VERSION_NAME }}
            commit: ${{ github.sha }}
            Package: com.rteats.mpeineo.dev, signed with the former Dev key.
            Diagnostics can be exported from Settings.
          files: |
            MPEI-Lite.apk
            update.json
      - name: Retire previous releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name != "latest") | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r id tag; do
            [ -n "$id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          done
      - name: Save build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-failure-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
