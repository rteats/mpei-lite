name: Main APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-apk
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish dated APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success
          gradle-home-cache-excludes: |
            caches/keyrings
      - name: Set Moscow build version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Main APK jobs run in series. Use the last published release as
          # the daily counter so failed attempts do not consume build numbers.
          PREVIOUS="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest"             --jq '.name' 2>/dev/null || true)"
          VERSION_NAME="$(python3 scripts/moscow_version.py "$PREVIOUS")"
          CODE=$((1000000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Build version: $VERSION_NAME (Europe/Moscow); Android code: $CODE"
      - name: Prepare app signing key
        env:
          KEYSTORE_B64: ${{ secrets.MPEI_STABLE_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.MPEI_STABLE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEY_PASSWORD" || {
            echo '::error::Set MPEI_STABLE_KEYSTORE_B64 and MPEI_STABLE_PASSWORD repository secrets'
            exit 1
          }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mpei-lite-stable.p12"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/mpei-lite-stable.p12"
            printf 'storeType=PKCS12\n'
            printf 'storePassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=mpei-lite-stable-2026\n'
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'versionCode=%s\n' "$VERSION_CODE"
            printf 'versionName=%s\n' "$VERSION_NAME"
          } > local-signing.properties
          chmod 600 local-signing.properties "$RUNNER_TEMP/mpei-lite-stable.p12"
      - name: Build signed APK
        run: |
          bash ./gradlew --no-daemon assembleRelease \
            -POPTIMIZE_RELEASE=true \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk MPEI-Lite.apk
      - name: Verify package and signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging MPEI-Lite.apk |
            grep -F "package: name='com.rteats.mpeilite' versionCode='$VERSION_CODE'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs MPEI-Lite.apk |
            grep -Fi 'Signer #1 certificate SHA-256 digest: f76a491b227107f9d2b1a371140a5aed8601b8669a23fb2bc61a4104f47dbe3b'
      - name: Write checked update manifest
        run: |
          SHA256="$(sha256sum MPEI-Lite.apk | cut -d ' ' -f1)"
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" "$SHA256" > update.json
      - name: Save downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: mpei-lite-apk
          path: |
            MPEI-Lite.apk
            update.json
          retention-days: 14
          if-no-files-found: error
      - name: Point latest tag at built commit
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
      - name: Publish one rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: MPEI Lite ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            Single rolling MPEI Lite build from main.
            versionCode: ${{ env.VERSION_CODE }}
            versionName: ${{ env.VERSION_NAME }}
            commit: ${{ github.sha }}
            Package: com.rteats.mpeilite, signed with the MPEI Lite key.
            Diagnostics can be exported from Settings.
          files: |
            MPEI-Lite.apk
            update.json
      - name: Save build failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-failure-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
