name: PR verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-pr:
    name: Verify PR code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Verify architecture ownership boundaries
        run: python3 scripts/check_architecture.py

      - name: Check maintenance cleanup safety
        run: python3 -m unittest discover -s scripts -p "test_*.py" -q

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # Read existing Gradle caches, but do not create another cache per PR.
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Materialize public dev keystore
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      # Test a real optimized release build, but publish APKs only from main.
      - name: Run unit tests, UI test compilation, lint, and compile release
        run: |
          start=$SECONDS
          gradle --no-daemon testDevReleaseUnitTest compileDevDebugAndroidTestKotlin lintDevDebug assembleDevRelease \
            -POPTIMIZE_RELEASE=true \
            -PPR_NUMBER=${{ github.event.pull_request.number }} \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.5.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
          echo "PR Gradle tasks: $((SECONDS - start)) seconds" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-verification
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

