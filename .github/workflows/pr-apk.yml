name: PR APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-apk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-pr:
    name: Build installable PR APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      # Read existing Gradle caches, but do not create another cache per PR.
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Materialize public dev keystore
        run: |
          base64 --decode ci/mpei-neo-dev.p12.b64 > "$RUNNER_TEMP/mpei-neo-dev.p12"
          echo "ANDROID_DEV_KEYSTORE_FILE=$RUNNER_TEMP/mpei-neo-dev.p12" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_ALIAS=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEY_PASSWORD=mpei-neo-dev" >> "$GITHUB_ENV"
          echo "ANDROID_DEV_KEYSTORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Run unit tests, UI test compilation, lint, and build signed PR APK
        run: |
          gradle --no-daemon testDevDebugUnitTest compileDevDebugAndroidTestKotlin lintDevDebug assembleDevRelease \
            -PPR_NUMBER=${{ github.event.pull_request.number }} \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.4.0-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}
          cp app/build/outputs/apk/dev/release/app-dev-release.apk \
            MPEI-Neo-PR-${{ github.event.pull_request.number }}.apk

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-verification
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: mpei-neo-pr-${{ github.event.pull_request.number }}-apk
          path: MPEI-Neo-PR-${{ github.event.pull_request.number }}.apk
          if-no-files-found: error
          retention-days: 14
